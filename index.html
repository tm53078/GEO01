<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地理．探索教室 1.0</title><style>:root{--ink:#15243a;--blue:#175b86;--orange:#d66e26;--paper:#f7f5ef;--line:#d7d1c3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}.top{height:70px;background:#fffdf8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 7vw}.brand{font-weight:800}.brand b{color:var(--orange);font-size:1.7rem}nav a{margin-left:20px;color:var(--ink);text-decoration:none}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:8vw;padding:80px 10vw;background:linear-gradient(105deg,#fcfbf6 60%,#d8e5e3 60%)}.eyebrow{font-size:.75rem;letter-spacing:.15em;font-weight:bold;color:var(--blue)}h1,h2{font-family:Georgia,"Noto Serif TC",serif;line-height:1.25}h1{font-size:clamp(2.4rem,5vw,4.7rem);margin:14px 0}.lead{font-size:1.1rem;line-height:1.9;max-width:520px}.button{display:inline-block;background:var(--ink);color:white;padding:14px 20px;text-decoration:none;margin-top:15px}.map{height:350px;position:relative;overflow:hidden;border:1px solid #c3a783;background:repeating-linear-gradient(0deg,#f6f0df 0 49px,#ddcda9 50px),repeating-linear-gradient(90deg,transparent 0 59px,#ddcda9 60px);box-shadow:14px 14px #aec9c8}.lat{position:absolute;left:0;right:0;top:50%;height:5px;background:var(--blue)}.lon{position:absolute;top:0;bottom:0;left:50%;width:5px;background:var(--orange)}.taiwan{position:absolute;z-index:2;left:43%;top:20%;width:105px;height:210px;background:#e8883b;border:3px solid #a9522c;clip-path:polygon(55% 0,78% 13%,89% 35%,81% 57%,92% 77%,66% 100%,32% 90%,20% 69%,7% 50%,21% 33%,28% 15%);transform:rotate(15deg)}.label{position:absolute;z-index:3;background:#fffdf8;padding:4px 7px;font-weight:bold}.latitude{left:12px;top:calc(50% - 30px);color:var(--blue)}.longitude{left:calc(50% + 10px);top:12px;color:var(--orange);writing-mode:vertical-rl}.map p{position:absolute;z-index:3;bottom:5px;left:14px;background:#fffdf8cc;padding:4px 7px;font-weight:bold}.section{padding:70px 10vw}.controls{padding:15px 0;margin:28px 0;border-block:1px solid var(--line);display:flex;gap:18px}.controls input,.controls select{padding:9px;border:1px solid #aaa;background:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fffdf8;border:1px solid var(--line);border-top:5px solid var(--blue);padding:20px;min-height:270px;display:flex;flex-direction:column}.card:nth-child(2){border-color:var(--orange)}.card h3{font-size:1.2rem;line-height:1.45}.card p{line-height:1.7;font-size:.92rem}.card a{margin-top:auto;color:var(--ink);font-weight:bold;text-decoration:none;border-top:1px solid var(--line);padding-top:12px}.method{background:#dbe8e6;display:grid;grid-template-columns:1fr 1fr;gap:8vw}.method li{padding:15px 0;border-top:1px solid #9dbab7;line-height:1.7}footer{text-align:center;background:var(--ink);color:white;padding:25px}@media(max-width:800px){.hero,.method{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.hero,.section{padding:55px 7vw}}@media(max-width:500px){.cards{grid-template-columns:1fr}.top{padding:0 5vw}.top nav a:first-child{display:none}}</style></head><body><header class="top"><div class="brand"><b>◎</b> 地理．探索教室</div><nav><a href="#lessons">教材總覽</a><a href="#method">學習方法</a></nav></header><section class="hero"><div><p class="eyebrow">JUNIOR HIGH GEOGRAPHY · VERSION 1.0</p><h1>從「我在哪裡」開始<br>讀懂我們生活的世界。</h1><p class="lead">給國中生的地理自學空間。選擇一個單元，先掌握概念，再用問題驗證自己的理解。</p><a class="button" href="#lessons">開始自學 ↓</a></div><div class="map"><div class="lat"></div><div class="lon"></div><div class="taiwan"></div><span class="label latitude">北緯 23.5°</span><span class="label longitude">東經 121°</span><p>經緯度在臺灣中部交會</p></div></section><section class="section" id="lessons"><p class="eyebrow">MATERIAL CATALOG</p><h2>教材總覽</h2><div class="controls"><select id="grade" onchange="filterCards()"><option value="">全部年級</option><option>七年級</option><option>八年級</option><option>九年級</option></select><input id="q" oninput="filterCards()" placeholder="搜尋教材，例如：地圖、臺灣"></div><div class="cards" id="cards"></div></section><section class="section method" id="method"><div><p class="eyebrow">HOW TO LEARN</p><h2>每一頁都用同一個節奏學習</h2></div><ol><li><b>觀察：</b>先看地圖、圖表或生活情境。</li><li><b>整理：</b>將概念放進自己的筆記脈絡。</li><li><b>回答：</b>用提問說出理由，而不只記住答案。</li></ol></section><footer>地理．探索教室 1.0｜學生免登入即可瀏覽</footer><script>const data=[['七年級','位置、地圖與座標系統','從生活中的位置描述出發，學會閱讀地圖、比例尺與座標。','請用座標描述一個你熟悉的位置。'],['七年級','位置對臺灣的影響','以臺灣為例，理解絕對位置、相對位置與島嶼環境。','臺灣的海陸位置如何影響生活？'],['八年級','中亞：乾燥環境與絲路','從地形、氣候與人文交流認識中亞的區域特色。','乾燥氣候如何影響中亞居民的生活？'],['九年級','歐洲的地形與生活','比較新褶曲山地、沖積平原與古老地塊如何影響生活。','地形如何改變人口與產業分布？']];function filterCards(){const g=grade.value,q=document.getElementById('q').value;cards.innerHTML=data.filter(x=>(!g||x[0]===g)&&x.join('').includes(q)).map((x,i)=>`<article class="card"><small>${x[0]}・單元 ${i+1}</small><h3>${x[1]}</h3><p>${x[2]}</p><a href="#" onclick="alert('想一想：${x[3]}');return false">進入學習頁 →</a></article>`).join('')}filterCards()</script></body></html>
